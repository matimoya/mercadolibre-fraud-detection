[project]
name = "mercadolibre-fraud-detection"
version = "0.1.0"
description = "Solucion para el challenge de deteccion de fraude de Mercado Libre"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "nbconvert>=7.17.1",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.1",
    "pylint>=4.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.basic]
good-names = ["X", "y"]

[tool.pylint.classes]
defining-attr-methods = ["__init__", "__new__", "setUp", "asyncSetUp", "__post_init__", "fit"]

[tool.pylint.design]
max-args = 6
max-positional-arguments = 6

[tool.pylint.format]
max-line-length = 100
