[project]
name = "mercadolibre-fraud-detection"
version = "0.1.0"
description = "Solucion para el challenge de deteccion de fraude de Mercado Libre"
requires-python = ">=3.11,<3.13"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]
